[tools]
uv = "0.11.31"

[hooks]
postinstall = { task = "install" }

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Create the virtual environment"
alias = "i"
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv"]
run = "uv sync"

# ── Quality ───────────────────────────────────────────────────────────────────

[tasks.check]
description = "Verify lockfile, lint, format, and type-check"
alias = "c"
run = "make check"

[tasks.ci-check]
description = "Same checks as `check`, failing instead of fixing"
run = "make check"

# ── Testing ───────────────────────────────────────────────────────────────────

[tasks."test:unit"]
description = "Run the unit tests"
alias = "t"
run = "cp -n .env.example .env; make test-cov"

[tasks.ci]
description = "Run all CI checks"
depends = ["ci-check", "test:unit"]
