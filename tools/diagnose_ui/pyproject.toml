# Separate uv project for the Gradio diagnosis UI (`make diagnose-ui`). gradio requires
# pillow<13, so keeping it out of the service's lock lets the service ship the current pillow.
[project]
name = "diagnose-ui"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bentoml-faster-whisper",
    "gradio>=6.20.0",
    "pytest~=9.1.0",
    "ty>=0.0.1",
]

[tool.uv]
package = false
# Supply-chain cooldown: uv only uses distributions uploaded at least 7 days ago.
exclude-newer = "P7D"
# Same as the service: faster-whisper 1.2.1 still passes av.open(metadata_errors=...).
constraint-dependencies = ["av<19"]

[tool.uv.sources]
bentoml-faster-whisper = { path = "../..", editable = true }
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchcodec = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
filterwarnings = ["ignore"]
